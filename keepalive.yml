# Mantém o projeto Supabase ativo (plano gratuito pausa após ~7 dias sem uso).
# Faz uma consulta leve à API a cada 3 dias. Também pode ser disparado à mão
# em Actions -> "Supabase keep-alive" -> Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 11 */3 * *"   # a cada 3 dias, 08:17 (horário de Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/bd_empresas?select=codigo&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"; cat /tmp/resp.txt; echo
          # 2xx/4xx = a requisição chegou ao banco (conta como atividade). 5xx/000 = falha real.
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi
